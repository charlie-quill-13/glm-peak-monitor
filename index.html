<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLM Peak Status</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬤</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.4rem;
  padding: 2rem 1rem;
  transition: background 0.5s;
}
.peak { background: #1a0a0a; color: #ff6b6b; }
.offpeak-promo { background: #0a1a0a; color: #51cf66; }
.offpeak-normal { background: #1a1a0a; color: #fcc419; }
.card {
  text-align: center;
  padding: 3rem 4rem;
  border-radius: 1rem;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}
.status { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
.multiplier { font-size: 4rem; font-weight: 800; letter-spacing: -2px; }
.countdown { font-size: 1.1rem; opacity: 0.8; margin-top: 1.5rem; }
.meta { font-size: 0.85rem; opacity: 0.5; margin-top: 1rem; }
.promo-badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 0.3rem; font-size: 0.8rem; margin-top: 1rem; }
.peak .promo-badge { background: rgba(255,107,107,0.2); }
.offpeak-promo .promo-badge { background: rgba(81,207,102,0.2); }
.offpeak-normal .promo-badge { background: rgba(252,196,25,0.2); }
.promo-expiry { font-size: 0.8rem; opacity: 0.4; margin-top: 0.5rem; }
.campaign-card { display: none; padding: 2rem 3rem; }
.campaign-card.live { display: block; background: rgba(96,124,255,0.12); border-color: rgba(128,150,255,0.5); }
.campaign-card.live .status, .campaign-card.live .multiplier { color: #93b1ff; }
.campaign-card.waiting { display: block; opacity: 0.55; }
.campaign-card .multiplier { font-size: 3rem; letter-spacing: -1px; }
</style>
</head>
<body>
<div class="card">
  <div class="status" id="status">—</div>
  <div class="multiplier" id="multiplier">—</div>
  <div class="countdown" id="countdown"></div>
  <div class="promo-badge" id="badge"></div>
  <div class="promo-expiry" id="promo-expiry"></div>
  <div class="meta">GLM-5.3 &amp; GLM-5.3-Flash · <span id="local-peak"></span></div>
</div>
<div class="card campaign-card" id="campaign-card">
  <div class="status" id="camp-status"></div>
  <div class="multiplier" id="camp-mult"></div>
  <div class="countdown" id="camp-countdown"></div>
  <div class="meta" id="camp-window"></div>
  <div class="meta">GLM-5.3-Flash only · API: 2× quota · ZCode ≥3.10: free · campaign ends Sep 20, 2026</div>
</div>
<script>
const PEAK_START = 6;   // 14:00 UTC+8 = 06:00 UTC
const PEAK_END = 10;    // 18:00 UTC+8 = 10:00 UTC
// 3× peak windows are weekdays-only (UTC+8); weekends are 1× all day
const isWeekendUTC = d => { const day = d.getUTCDay(); return day === 0 || day === 6; };
// Standard deal unchanged (still in place)
// Temporary campaign ON TOP: GLM-5.3-Flash, Sep 3–20 2026, 23:00–09:00 UTC+8 (15:00–01:00 UTC)
const CAMPAIGN_START = Date.UTC(2026, 8, 2, 16, 0, 0);  // Sep 3 00:00 UTC+8
const CAMPAIGN_END   = Date.UTC(2026, 8, 20, 15, 59, 59); // Sep 20 23:59 UTC+8

function update() {
  const now = new Date();
  const utcH = now.getUTCHours();
  const cstDay = new Date(now.getTime() + 8 * 3600000).getUTCDay();
  const weekend = cstDay === 0 || cstDay === 6;
  const isPeak = !weekend && utcH >= PEAK_START && utcH < PEAK_END;
  const campaignRunning = now >= CAMPAIGN_START && now <= CAMPAIGN_END;

  // --- Flash campaign card (own card, local TZ, live/waiting state) ---
  const camp = document.getElementById('campaign-card');
  if (campaignRunning) {
    // window: 23:00-09:00 UTC+8 = 15:00 UTC -> 01:00 UTC next day (10h)
    let winStart = new Date(now); winStart.setUTCHours(15, 0, 0, 0);
    if (winStart > now) winStart.setUTCDate(winStart.getUTCDate() - 1);
    const winEnd = new Date(winStart.getTime() + 10 * 3600000);
    const inWindow = now >= winStart && now < winEnd;
    let dispStart = new Date(winStart), dispEnd = new Date(winEnd);
    if (!inWindow) {
      dispStart = new Date(winEnd); dispStart.setUTCHours(15, 0, 0, 0);
      if (dispStart <= now) dispStart.setUTCDate(dispStart.getUTCDate() + 1);
      dispEnd = new Date(dispStart.getTime() + 10 * 3600000);
    }
    const fmt = d => d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    document.getElementById('camp-window').textContent = `Daily ${fmt(dispStart)}–${fmt(dispEnd)} (your time)`;
    const fmtCd = ms => `${Math.floor(ms / 3600000)}h ${Math.floor((ms % 3600000) / 60000)}m`;
    if (inWindow) {
      camp.className = 'card campaign-card live';
      document.getElementById('camp-status').textContent = '⚡ FLASH CAMPAIGN LIVE';
      document.getElementById('camp-mult').textContent = '2×';
      document.getElementById('camp-countdown').textContent = `2× quota ends in ${fmtCd(winEnd - now)}`;
    } else {
      camp.className = 'card campaign-card waiting';
      document.getElementById('camp-status').textContent = 'FLASH CAMPAIGN · NOT ACTIVE NOW';
      document.getElementById('camp-mult').textContent = '2×';
      document.getElementById('camp-countdown').textContent = `Starts in ${fmtCd(dispStart - now)}`;
    }
  } else {
    camp.style.display = 'none';
  }

  let mult, label, cls, emoji;
  if (isPeak) {
    mult = 3; label = 'PEAK'; cls = 'peak'; emoji = '🔴';
  } else {
    mult = 1; label = 'OFF-PEAK'; cls = 'offpeak-promo'; emoji = '🟢';
  }

  document.body.className = cls;
  document.getElementById('status').textContent = label;
  document.getElementById('multiplier').textContent = mult + '×';
  document.getElementById('badge').textContent = weekend ? '🛋️ Weekend · 1× all day' : '🔥 1× off-peak (permanent)';

  // Favicon
  const colors = { peak: 'ff6b6b', 'offpeak-promo': '51cf66', 'offpeak-normal': 'fcc419' };
  document.getElementById('favicon').href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23${colors[cls]}'/></svg>`;
  document.title = `${emoji} ${mult}× — ${weekend ? 'WEEKEND' : label}`;

  // Countdown to next change (on weekends: countdown to Monday's peak)
  let next, cdLabel = 'Changes in';
  if (isPeak) {
    next = new Date(now); next.setUTCHours(PEAK_END, 0, 0, 0);
    if (next <= now) next.setUTCDate(next.getUTCDate() + 1);
  } else {
    next = new Date(now); next.setUTCHours(PEAK_START, 0, 0, 0);
    if (next <= now) next.setUTCDate(next.getUTCDate() + 1);
    while (isWeekendUTC(next)) next.setUTCDate(next.getUTCDate() + 1);
    if (weekend) cdLabel = 'Peak returns ' + next.toLocaleDateString(undefined, { weekday: 'short' }) + ' · in';
  }
  const diff = next - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('countdown').textContent = `${cdLabel} ${h}h ${m}m ${s}s`;

  // Local peak hours display
  const localPeakStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), PEAK_START)).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  const localPeakEnd = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), PEAK_END)).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  document.getElementById('local-peak').textContent = `${localPeakStart}–${localPeakEnd} peak · Mon–Fri (local)`;
}

update();
setInterval(update, 1000);
</script>
</body>
</html>
